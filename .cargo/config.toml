[alias]
cov = [
    "llvm-cov", "nextest", "--workspace", "--remap-path-prefix",
    "--exclude", "lemma-proto",
    "--exclude", "lemma-napi",
    "--exclude", "lemma-uniffi",
    "--ignore-filename-regex", '[/\\](build[/\\][^/\\]+[/\\]([^/\\]+[/\\])?out[/\\]|lemma-daemon[/\\]src[/\\](main|config|daemon|web_dist)\.rs$)',
    "--fail-uncovered-lines", "0",
    "--fail-uncovered-functions", "0",
]
